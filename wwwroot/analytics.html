<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ري باي — لوحة التحكم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
<style>
@font-face{font-family:Thmanyah;src:url('/fonts/thmanyahsans-Regular.woff2') format('woff2');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Thmanyah,Arial,sans-serif;font-size:16px}main{max-width:1120px;margin:auto;padding:52px 32px}h1{font-size:42px;font-weight:500;line-height:1.4;margin:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:28px;border-bottom:0}.actions{display:flex;gap:10px}button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid #ccc;padding:11px 18px;cursor:pointer;font:inherit;color:#111;border-radius:6px}button:hover{background:#f5f5f5}button:disabled{cursor:wait;opacity:.65}.solid{background:#111;color:#fff}.solid:hover{background:#333}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:30px;border-top:1px solid #ddd;border-right:1px solid #ddd}.metric{padding:26px;border-left:1px solid #ddd;border-bottom:1px solid #ddd;min-height:180px}.label{font-size:16px;font-weight:700}.value{display:block;width:fit-content;max-width:100%;overflow-wrap:anywhere;font-size:44px;line-height:1.5;margin:12px 0 4px;font-variant-numeric:tabular-nums;direction:ltr}.note{font-size:13px;line-height:1.6;color:#666}.updated{font-size:13px;color:#666;margin:18px 0 32px}.table-wrap{width:100%}.user-table{table-layout:fixed}.user-table{width:100%;border-collapse:collapse;text-align:right;white-space:normal;overflow-wrap:anywhere}.user-table th,.user-table td{padding:18px 12px;border-bottom:1px solid #e7e7e7}.user-table th{background:#f5f5f5;font-weight:700;font-size:14px}.user-table tbody tr:nth-child(even){background:#fcfcfc}.user-table tbody tr:hover{background:#f6f6f6}.user-table tr:last-child td{border-bottom:0}.user-table td:first-child{white-space:normal}.numeric{font-variant-numeric:tabular-nums}.mobile{direction:ltr;text-align:right}.table-title{font-size:24px;font-weight:500;margin:32px 0 14px}.login{max-width:440px;margin-top:40px}label{display:block}input{font:inherit;padding:13px;border:1px solid #aaa;border-radius:6px;width:100%;margin:12px 0 18px}.error{color:#9b2424;line-height:1.7;margin:18px 0}.spinner{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}.empty{text-align:center!important;color:#777;padding:36px!important}.repeat-note{font-size:13px;color:#666;line-height:1.7;margin-top:12px}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}@media(max-width:700px){main{padding:28px 20px}h1{font-size:30px}.heading{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:20px;min-height:175px}.value{font-size:34px}.user-table th,.user-table td{padding:16px}}
.signed-out main{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.signed-out .heading{justify-content:center;padding:0;width:100%}.signed-out .login{width:100%;margin:28px auto 0}.signed-out .login input{text-align:center}.signed-out .error{margin:12px 0 0}.user-table thead th{border-bottom:0}@media(max-width:700px){.user-table th,.user-table td{padding:12px 5px;font-size:12px}.user-table th{font-size:11px}.signed-out .heading{align-items:center}.signed-out h1{font-size:28px}.mobile{font-size:11px!important}}
.value,.numeric,.mobile,#password[type="tel"],#updated time{font-family:Nunito,Arial,sans-serif;font-variant-numeric:tabular-nums}
</style>
</head>
<body class="signed-out"><main>
<div class="heading"><h1 id="heading">الدخول في لوحة التحكم</h1><div id="actions" class="actions" hidden><button id="refresh" type="button"><span class="spinner" hidden></span><span class="button-label">تحديث</span></button><button id="logout" type="button">خروج</button></div></div>
<p id="error" class="error" role="status" aria-live="polite"></p>
<form id="login" class="login"><label id="loginLabel" for="password">كلمة مرور لوحة التحكم</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" class="solid" type="submit"><span class="spinner" hidden></span><span class="button-label">دخول</span></button></form>
<section id="dashboard" hidden aria-label="إحصاءات ري باي">
<div class="grid">
<article class="metric"><span class="label">المستخدمون</span><strong class="value" id="users">—</strong></article>
<article class="metric"><span class="label">المحادثات</span><strong class="value" id="conversations">—</strong></article>
<article class="metric"><span class="label">التحويل</span><strong class="value" id="transfers">—</strong></article>
<article class="metric"><span class="label">إجمالي المبالغ</span><strong class="value" id="totalAmounts">—</strong></article>
<article class="metric"><span class="label">متوسط المبالغ</span><strong class="value" id="averageAmounts">—</strong></article>
<article class="metric"><span class="label">متوسط تكرار المستخدم</span><strong class="value" id="averageRepeat">—</strong></article>
</div>
<p id="updated" class="updated" role="status"></p>
<h2 class="table-title">المستخدمون</h2>
<div class="table-wrap"><table class="user-table" aria-label="نشاط المستخدمين"><colgroup><col style="width:28%"><col style="width:27%"><col style="width:15%"><col style="width:12%"><col style="width:18%"></colgroup><thead><tr><th scope="col">الاسم</th><th scope="col">رقم الجوال</th><th scope="col">عدد العمليات</th><th scope="col">التكرار</th><th scope="col">عدد المحادثات</th></tr></thead><tbody id="userRows"></tbody></table></div>

</section></main>
<script>
let phoneMode=false,password='';
const el=id=>document.getElementById(id);
const englishDigits=s=>s.replace(/[٠-٩۰-۹]/g,c=>String(c.charCodeAt(0)-(c>='۰'?1776:1632)));
const count=new Intl.NumberFormat('en-US'),decimal=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function signedIn(value){document.body.className=value?'signed-in':'signed-out';el('heading').textContent=value?'ري باي بالأرقام':'الدخول في لوحة التحكم';el('dashboard').hidden=!value;el('actions').hidden=!value;el('login').hidden=value;}
function loading(value){for(const id of ['refresh','loginButton']){const button=el(id);button.disabled=value;button.setAttribute('aria-busy',String(value));button.querySelector('.spinner').hidden=!value;button.querySelector('.button-label').textContent=value?'جارٍ التحميل…':id==='refresh'?'تحديث':'دخول';}el('logout').disabled=value;}
async function refresh(){
 if(el('refresh').disabled)return;
 el('error').textContent='';loading(true);
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);
 try{
  const r=await fetch('/api/analytics',{headers:{Authorization:'Bearer '+password},cache:'no-store',signal:controller.signal});
  if(!r.ok){if(r.status===401){password='';signedIn(false);}throw new Error(r.status===401?'بيانات الدخول غير صحيحة':r.status===429?'محاولات كثيرة، انتظر دقيقة ثم جرّب':'تعذر تحميل الإحصاءات، جرّب مرة ثانية');}
  const d=await r.json();
  for(const key of ['users','conversations','transfers'])el(key).textContent=count.format(d[key]);
  for(const key of ['totalAmounts','averageAmounts','averageRepeat'])el(key).textContent=decimal.format(d[key]);
  el('userRows').replaceChildren();
  const users=[...(d.userList||[])].sort((a,b)=>b.operations-a.operations||b.conversations-a.conversations||a.name.localeCompare(b.name,'ar'));
  for(const u of users){const row=document.createElement('tr');[u.name,u.mobile,count.format(u.operations),count.format(u.repeats),count.format(u.conversations)].forEach((value,index)=>{const cell=document.createElement('td');cell.textContent=englishDigits(String(value));if(index===1)cell.className='mobile';else if(index>1)cell.className='numeric';row.appendChild(cell);});el('userRows').appendChild(row);}
  if(!users.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=5;cell.className='empty';cell.textContent='لا يوجد مستخدمون بعد';row.appendChild(cell);el('userRows').appendChild(row);}
  el('updated').replaceChildren();const time=document.createElement('time');time.dateTime=d.updatedAt;time.dir='ltr';time.textContent=new Date(d.updatedAt).toLocaleString('en-GB',{hour12:false});el('updated').append('آخر تحديث: ');el('updated').appendChild(time);signedIn(true);
 }catch(e){el('error').textContent=e.name==='AbortError'?'استغرق التحميل وقتًا طويلًا، جرّب التحديث مرة ثانية':e.message;}
 finally{clearTimeout(timeout);loading(false);}
}
fetch('/api/analytics/login-mode',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json();}).then(d=>{phoneMode=d.phone;if(phoneMode){el('loginLabel').textContent='رقم الجوال';el('password').type='tel';el('password').inputMode='tel';el('password').autocomplete='tel';el('password').dir='ltr';el('password').oninput=()=>{el('password').value=englishDigits(el('password').value);};}}).catch(()=>{});
el('login').onsubmit=e=>{e.preventDefault();password=phoneMode?englishDigits(el('password').value).trim():el('password').value;el('password').value='';refresh();};el('refresh').onclick=refresh;el('logout').onclick=()=>{password='';el('userRows').replaceChildren();signedIn(false);el('error').textContent='';};
</script></body></html>
